<h2>Available Books</h2>
    <ul *ngIf="books && books.length > 0; else noBooks">
      <li *ngFor="let book of books">
        <h3>{{ book.title }}</h3>
        <p>By: {{ book.author }}</p>
        <p>Price: ${{ book.price }}</p>
        <img *ngIf="book.imageUrl" [src]="book.imageUrl" alt="{{ book.title }} Cover" width="100">
        <p *ngIf="book.description">{{book.description}}</p>
        <button (click)="addToCart(book)">Add to Cart</button>
      </li>
    </ul>
    <ng-template #noBooks>
      <p>No books available at the moment.</p>
    </ng-template>
