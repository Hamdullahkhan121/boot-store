<div class="login-container">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" class="form-control" placeholder="Enter your email">
        <div *ngIf="email?.invalid && email?.touched" class="error">
          <small *ngIf="email?.hasError('required')">Email is required.</small>
          <small *ngIf="email?.hasError('email')">Please enter a valid email address.</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" class="form-control" placeholder="Enter your password">
        <div *ngIf="password?.invalid && password?.touched" class="error">
          <small *ngIf="password?.hasError('required')">Password is required.</small>
          <small *ngIf="password?.hasError('minlength')">Password must be at least 6 characters long.</small>
        </div>
      </div>
  
      <button class="btn btn-primary" type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Login</button>
    </form>
  </div>
