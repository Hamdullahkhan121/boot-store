<i class="fa fa-shopping-cart" style="font-size:48px;"></i>
<h2>Shopping Cart</h2>

    <div *ngIf="cartItems().length === 0; else cartContents">Your cart is empty.</div>

    <ng-template #cartContents>
      <ul>
        <li *ngFor="let item of cartItems()">
          {{ item.book.title }} x
          <input type="number" [(ngModel)]="item.quantity" (change)="updateQuantity(item)" min="1">
          - ${{ item.book.price * item.quantity }}
          <button class="btn btn-danger" (click)="removeFromCart(item.book.id)">Remove</button>
        </li>
      </ul>
      <p>Total: ${{ cartTotal() }}</p>
      <button class="btn btn-primary" class="btn btn-primary" (click)="checkout()" [disabled]="cartItems().length === 0">Checkout</button>
    </ng-template>
